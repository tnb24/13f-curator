[project]
name = "13f-curator"
version = "1.0.0"
description = "A 13F holdings dataset built from SEC EDGAR, and an LLM agent that answers questions about it in SQL."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the built tables under output/ or the local EDGAR cache; skips without them",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache", ".venv", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # the tests hold non-ASCII text on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"verify.py" = ["E501", "UP", "SIM", "B"]  # supplied by the challenge organisers; kept as supplied
"scripts/eda.py" = ["E501"]
"agents/resolve.py" = ["SIM905"]  # the stop-word list reads best as text
